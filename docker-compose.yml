services:
    helf:
        build: .
        # TrueNAS starts the app with `docker compose up`, which builds only when
        # the image is *absent* — so a code change never reached a restarted app
        # without a manual `docker compose build`. `pull_policy: build` makes
        # every `up` rebuild. Layer caching means an unchanged tree costs seconds.
        pull_policy: build
        # Both services are the same image, differing only in command. Naming it
        # explicitly keeps the second build a pure cache hit against the first
        # rather than a second tag of identical layers.
        image: helf:latest
        container_name: helf-app
        ports:
            - "30171:8080"
        volumes:
            # Persist workout data and database
            - ${HELF_DATA_PATH}:/app/data
        environment:
            # Data directory (container path)
            - DATA_DIR=/app/data

            # MQTT ingest is RETIRED (plan 0015) and off unless switched on.
            # The BF720 is read straight from the browser over Web Bluetooth,
            # so the phone, openScale and the broker are all out of the path.
            #
            # Kept because it is the fallback for a scale the browser cannot
            # read: the decoder handles the Bluetooth SIG profile only, while
            # openScale drives about a hundred scales. To use it, uncomment
            # MQTT_ENABLED and point the host at a broker.
            # - MQTT_ENABLED=true
            - MQTT_BROKER_HOST=host.docker.internal
            - MQTT_BROKER_PORT=1883

            # API configuration
            - CORS_ORIGINS=["*"]

            # Production settings
            - PRODUCTION=true
        extra_hosts:
            # Only reached when MQTT ingest is switched back on above. Harmless
            # otherwise, and removing it would make re-enabling a two-file job.
            - "host.docker.internal:host-gateway"
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health').read()",
                ]
            interval: 60s
            timeout: 10s
            start_period: 40s
            retries: 3

    # The MCP server for agent access. A **separate process on the same file**,
    # not a route on the API — ADR-0002 and ADR-0004 both turn on that, and
    # mounting it into FastAPI would make it share a code path with the app.
    # Same image, different command; the two-writer contention this creates is
    # what `audit_actor` + `BEGIN IMMEDIATE` already exist to handle.
    helf-mcp:
        build: .
        pull_policy: build
        image: helf:latest
        container_name: helf-mcp
        # The image's CMD is uvicorn on 8080 — without this override the "MCP"
        # container silently ran a second copy of the API and nothing ever
        # listened on 8081. `python -m` works because the image sets
        # PYTHONPATH=/app with the package at /app/app, matching how the module
        # is run from `backend/` in development.
        command: ["python", "-m", "app.mcp.qs_mcp"]
        ports:
            # helf.pryce.fyi resolves on the tailnet via AdGuard, so this is
            # reachable only from the tailnet. It is NOT authenticated: read-only
            # is a tool-registration gate, not a confidentiality control
            # (ADR-0004), and `write_next_mobility_session` is registered in both
            # modes. Anything that can reach this port can read the database and
            # rewrite the pending mobility session.
            - "30172:8081"
        volumes:
            - ${HELF_DATA_PATH}:/app/data
        environment:
            - QS_DB_PATH=/app/data/helf.db
            - QS_MCP_MODE=read-only
            - QS_MCP_TRANSPORT=streamable-http
            # Bind all interfaces *inside* the container so the published port
            # reaches it. The tailnet, not this bind, is the boundary.
            - QS_MCP_HOST=0.0.0.0
            - QS_MCP_PORT=8081
        depends_on:
            # Not for ordering of the socket but for the schema: the API's
            # startup runs `alembic upgrade head`, and the MCP server refuses to
            # start against a database that is missing or empty.
            helf:
                condition: service_healthy
        restart: unless-stopped
        # The image's HEALTHCHECK probes the API's /api/health on 8080, which
        # this container does not serve — inherited unchanged it would report
        # unhealthy forever. A TCP connect to the MCP port is the honest check:
        # the streamable-http endpoint answers only to POSTs carrying MCP
        # framing, so there is no GET that means "healthy".
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import socket; socket.create_connection(('127.0.0.1', 8081), 5).close()",
                ]
            interval: 60s
            timeout: 10s
            start_period: 20s
            retries: 3

    # The development box: a Claude Code session with this repo bind-mounted,
    # reachable over Remote Control as "HelfDev". Ran by hand as
    #   docker run --rm -it --name helf-dev \
    #     -v /mnt/fast/custom/home:/home/ubuntu \
    #     -v /mnt/fast/custom/helf:/mnt \
    #     pryce-devbox claude --dangerously-skip-permissions --remote-control --name HelfDev
    # until it lived here.
    #
    # It is NOT part of the app. It shares no network, no socket and no
    # dependency with the two services above — it reaches the database the same
    # way any shell would, through the mounted tree.
    helf-dev:
        # `pryce-devbox` is built elsewhere and lives only in the local image
        # store. Without `pull_policy: never`, compose treats a missing image as
        # something to fetch and fails on a registry lookup that was never going
        # to resolve. Note this is the opposite of the two services above, which
        # build from this repo's Dockerfile on every `up`.
        image: pryce-devbox
        pull_policy: never
        container_name: helf-dev
        command:
            ["claude", "--dangerously-skip-permissions", "--remote-control", "--name", "HelfDev"]
        volumes:
            # The home directory carries the Claude credentials, settings and
            # session history, so the box comes back as itself after a restart.
            - ${HELF_DEV_HOME_PATH:-/mnt/fast/custom/home}:/home/ubuntu
            # The repo, at /mnt — which is what CLAUDE.md's paths assume, and it
            # is the working tree the app is built from, not a copy. Edits here
            # are edits to what the next `docker compose up` builds, and
            # data/helf.db underneath it is the live database.
            - ${HELF_REPO_PATH:-/mnt/fast/custom/helf}:/mnt
        # The `-it` half of the original command. Claude is a TUI: without both
        # of these it reads EOF on an absent stdin and exits immediately, which
        # looks exactly like a crash loop. Attach with `docker attach helf-dev`
        # (detach with ctrl-p ctrl-q, which leaves the session running).
        stdin_open: true
        tty: true
        # The `--rm` half has no service equivalent, and the honest replacement
        # is not to resurrect it: `unless-stopped` would relaunch a fresh agent
        # every time you quit one, so exiting the TUI would never mean exited.
        # A NAS reboot brings it back because `up` does, which is the case that
        # mattered.
        restart: "no"
