// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // No versions here (nothing is pinned): the Dockerfile resolves the
        // newest stable AGP and passes it as -PhelfAgpVersion. google-services
        // is only applied when a google-services.json exists, which it doesn't.
        classpath "com.android.tools.build:gradle:${property('helfAgpVersion')}"
        classpath 'com.google.gms:google-services:latest.release'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
